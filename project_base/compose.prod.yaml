name: expense-manager-production

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: web
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    env_file:
      - ./expense_api/.env.gemini
    environment:
      APP_ENV: production
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-ai_expense_manager}"
      DB_USER: "${DB_USER:-expense_app}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the production environment}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      GEMINI_VISION_MODEL: "${GEMINI_VISION_MODEL:-gemini-3.5-flash-lite}"
      SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?Set SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?Set SMTP_PASSWORD}"
      PASSWORD_RESET_FROM: "${PASSWORD_RESET_FROM:?Set PASSWORD_RESET_FROM}"
      CORS_ALLOWED_ORIGIN: "${CORS_ALLOWED_ORIGIN:-}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'require \"/var/www/expense_api/bootstrap/db.php\"; exit($$conn->ping() ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_NAME:-ai_expense_manager}"
      MYSQL_USER: "${DB_USER:-expense_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    volumes:
      - expense_database:/var/lib/mysql
      - ./expense_api/database/00_core_schema.sql:/docker-entrypoint-initdb.d/00_core_schema.sql:ro
      - ./expense_api/database/schema_extensions.sql:/docker-entrypoint-initdb.d/10_schema_extensions.sql:ro
      - ./expense_api/database/social_streaks.sql:/docker-entrypoint-initdb.d/20_social_streaks.sql:ro
      - ./expense_api/database/password_reset_tokens.sql:/docker-entrypoint-initdb.d/30_password_reset_tokens.sql:ro
      - ./expense_api/database/login_attempts.sql:/docker-entrypoint-initdb.d/40_login_attempts.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: always


volumes:
  expense_database:
