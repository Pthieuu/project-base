name: expense-manager

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: ai_expense_manager
      DB_USER: expense_app
      DB_PASSWORD: expense_app_password
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      OLLAMA_VISION_MODEL: gemma3:4b
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_expense_manager
      MYSQL_USER: expense_app
      MYSQL_PASSWORD: expense_app_password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - expense_database:/var/lib/mysql
      - ./expense_api/database/00_core_schema.sql:/docker-entrypoint-initdb.d/00_core_schema.sql:ro
      - ./expense_api/database/schema_extensions.sql:/docker-entrypoint-initdb.d/10_schema_extensions.sql:ro
      - ./expense_api/database/social_streaks.sql:/docker-entrypoint-initdb.d/20_social_streaks.sql:ro
      - ./expense_api/database/password_reset_tokens.sql:/docker-entrypoint-initdb.d/30_password_reset_tokens.sql:ro
      - ./expense_api/database/login_attempts.sql:/docker-entrypoint-initdb.d/40_login_attempts.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u expense_app -pexpense_app_password --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.2
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:0.32.2
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull llama3.2 && ollama pull gemma3:4b
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  expense_database:
  ollama_models:
